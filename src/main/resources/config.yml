# Death Breakdown (Paper) settings

# How many seconds before death to include (1-60)
window-seconds: 10

# Show damage in hearts (true) or health points (false)
hearts: true

# After death, post the summary line in chat with [details] (hover) and [Open recap] (book)
chat-on-death: true

# Also open the recap book automatically right after respawning
book-on-respawn: false

# Lines shown for each hit (in the hover text and the book)
show:
  armor: true
  enchants: true
  other: true
  health-left: true

# Show one short tip under the summary, e.g. "Lava did 89% of the damage." (added in 1.1.0)
show-tip: true

# How many of each player's last deaths to keep (1-20). /db history lists them. (added in 1.1.0)
history-size: 5

# Keep them in plugins/DeathBreakdown/history so they survive leaving and restarts (added in 1.1.0)
save-history: true
