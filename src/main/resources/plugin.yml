name: DeathBreakdown
version: '${version}'
main: com.cosmiclogic.deathbreakdown.paper.DeathBreakdownPlugin
api-version: '1.13'
author: CosmicLogic
website: https://github.com/CosmicLogic0/deathbreakdown-plugin
depend: [LogicLib]
description: See exactly what killed you. Every hit from your last 10 seconds, in chat or a book.
commands:
  deathbreakdown:
    description: Your last death recap. /deathbreakdown help lists everything.
    usage: /<command> [help|history|show <n>|chat|book|copy|player <name>|reload]
    aliases: [db]
permissions:
  deathbreakdown.use:
    description: See your own death recap
    default: true
  deathbreakdown.reload:
    description: Reload config.yml
    default: op
  deathbreakdown.others:
    description: See another player's last recap with /deathbreakdown player <name>
    default: op
