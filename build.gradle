plugins {
    id 'java'
}

base {
    archivesName = 'deathbreakdown-paper'
}

repositories {
    mavenCentral()
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

// The plain-Java core is shared with the Forge/NeoForge mod.
sourceSets.main.java.srcDir(file('core/src/main/java'))

dependencies {
    // Same as LogicLib for Paper: compiled against the 1.13.2 API so one jar runs on Paper 1.12.2 ... 26.x.
    compileOnly 'com.destroystokyo.paper:paper-api:1.13.2-R0.1-SNAPSHOT'
    // LogicLib for Paper is a separate, required plugin (hub rule 2026-11-16: "Requires LogicLib" + Required Dependency).
    compileOnly files(project.property('logiclib_jar'))
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 8 bytecode so 1.12.2 / 1.16.5 servers (Java 8) can load it too.
    options.release = 8
}

processResources {
    def props = [version: version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}
